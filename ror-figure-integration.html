    const SCOPE = "integration";
    const LAYOUT = "cose";
    const CORE = new Set(["Organization","CustomerDeployment","Tenant","Contract","Opportunity","Engagement","Employee","Contact"]);
    const INTEGRATION = new Set(["Organization","CustomerDeployment","Tenant"]);
    const COLORS = {
      Organization:"#0000CC", CustomerDeployment:"#0070F2", Tenant:"#2f6a52", Contract:"#C70",
      Opportunity:"#5050ff", Engagement:"#61c", Employee:"#003", Contact:"#0070F2",
      Ticket:"#e33", Course:"#497", Location:"#c70", Individual:"#8888b0",
      Household:"#babade", Supplier:"#2f6a52", Campaign:"#6611cc"
    };

    function hideByScope(kind, typeId, abstract) {
      if (SCOPE === "all") return kind !== "entity";
      if (SCOPE === "core") return kind !== "entity" || !CORE.has(typeId);
      if (SCOPE === "integration") {
        if (kind === "entity") return !INTEGRATION.has(typeId);
        if (kind === "interaction" || kind === "connector") return true;
        return !(kind === "source" || kind === "capability" || kind === "graph" || kind === "grouping");
      }
      return false;
    }

    function buildElements() {
      const elements = [];
      (MODEL.entities || []).forEach((e) => {
        elements.push({ data: {
          id: "E:"+e.id, typeId: e.id, label: e.label, kind: "entity", abstract: e.abstract,
          color: COLORS[e.id] || "#0000CC"
        }});
      });
      (MODEL.interactions || []).forEach((i) => {
        elements.push({ data: { id: "I:"+i.id, typeId: i.id, label: i.label, kind: "interaction" }});
      });
      (MODEL.sources || []).forEach((s) => {
        elements.push({ data: { id: "S:"+s.id, typeId: s.id, label: s.label, kind: "source" }});
      });
      (MODEL.connectors || []).forEach((c) => {
        elements.push({ data: { id: "C:"+c.id, typeId: c.id, label: c.label, kind: "connector" }});
      });
      (MODEL.capabilities || []).forEach((c) => {
        elements.push({ data: { id: "P:"+c.id, typeId: c.id, label: c.label, kind: "capability" }});
      });
      (MODEL.graphTypes || []).forEach((g) => {
        elements.push({ data: { id: "G:"+g.id, typeId: g.id, label: g.label, kind: "graph" }});
      });
      (MODEL.grouping || []).forEach((g) => {
        elements.push({ data: { id: "H:"+g.id, typeId: g.id, label: g.label, kind: "grouping" }});
      });
      const unbundle = (SCOPE === "core");
      if (unbundle) {
        const pairMap = new Map();
        (MODEL.relations || []).forEach((r) => {
          if (!CORE.has(r.from) || !CORE.has(r.to)) return;
          if (r.from === r.to) return;
          const key = r.from + ">" + r.to;
          const arr = pairMap.get(key) || [];
          arr.push(r);
          pairMap.set(key, arr);
        });
        pairMap.forEach((rels) => {
          const first = rels[0];
          const names = rels.map((x) => x.label || x.id);
          elements.push({ data: {
            id: "rel:"+rels.map(x=>x.id).join("+"),
            source: "E:"+first.from, target: "E:"+first.to,
            kind: "relation",
            label: names.join("\n")
          }});
        });
      } else {
        const pairMap = new Map();
        (MODEL.relations || []).forEach((r) => {
          const key = r.from === r.to ? ("E:"+r.from+"|"+r.id) : ["E:"+r.from, "E:"+r.to].sort().join("|");
          const arr = pairMap.get(key) || [];
          arr.push(r);
          pairMap.set(key, arr);
        });
        pairMap.forEach((rels) => {
          const first = rels[0];
          elements.push({ data: {
            id: "rel:"+rels.map(x=>x.id).join("+"),
            source: "E:"+first.from, target: "E:"+first.to,
            kind: "relation",
            label: rels.length > 1 ? String(rels.length) : (first.label || first.id)
          }});
        });
      }
      if (SCOPE === "integration") {
        (MODEL.sourceFeeds || []).forEach((f, i) => {
          elements.push({ data: { id: "feed:"+i, source: "S:"+f.from, target: "E:"+f.to, kind: "feed", label: "" }});
        });
      }
      (MODEL.connectors || []).forEach((c) => {
        elements.push({ data: { id: "cen:"+c.id, source: "C:"+c.id, target: "E:"+(c.to || "Tenant"), kind: "enable", label: "" }});
      });
      (MODEL.capabilities || []).forEach((c) => {
        elements.push({ data: { id: "pen:"+c.id, source: "P:"+c.id, target: "E:Tenant", kind: "enable", label: "" }});
      });
      (MODEL.graphTypes || []).forEach((g) => {
        const seen = new Set();
        (g.relations || []).forEach((rid) => {
          (MODEL.relations || []).forEach((r) => {
            if (r.id !== rid) return;
            ["from", "to"].forEach((end) => {
              const key = g.id + "|" + r[end];
              if (seen.has(key)) return;
              seen.add(key);
              elements.push({ data: { id: "gt:"+g.id+":"+r[end], source: "G:"+g.id, target: "E:"+r[end], kind: "graphedge", label: "" }});
            });
          });
        });
      });
      return elements;
    }

    function start() {
      if (typeof cytoscape === "undefined") {
        document.body.insertAdjacentHTML("afterbegin", "<p style='color:red'>Cytoscape failed to load</p>");
        document.title = "READY";
        return;
      }
      if (typeof cytoscapeDagre !== "undefined") {
        try { cytoscape.use(cytoscapeDagre); } catch (e) { console.warn(e); }
      }
    const cy = cytoscape({
      container: document.getElementById("cy"),
      elements: buildElements(),
      minZoom: 0.1,
      maxZoom: 3,
      wheelSensitivity: 0.2,
      style: [
        { selector: "node", style: { label:"data(label)", "font-size": SCOPE === "core" ? 18 : 14, "font-weight":500, color:"#0e0e25", "text-valign":"bottom", "text-margin-y":10, "text-wrap":"wrap", "text-max-width":160 }},
        { selector: "node[kind = 'entity']", style: { width: SCOPE === "core" ? 88 : 64, height: SCOPE === "core" ? 88 : 64, shape:"ellipse", "background-color":"data(color)", "font-weight":600 }},
        { selector: "node[abstract]", style: { "border-width":1.5, "border-style":"dashed", "border-color":"#8888b0", "background-opacity":0.55 }},
        { selector: "node[kind = 'interaction']", style: { width:40, height:40, shape:"ellipse", "background-color":"#6611cc26", "border-width":1.5, "border-style":"dashed", "border-color":"#61c" }},
        { selector: "node[kind = 'source']", style: { width:38, height:38, shape:"ellipse", "background-color":"#44997726", "border-width":1.5, "border-style":"dashed", "border-color":"#497" }},
        { selector: "node[kind = 'connector']", style: { width:52, height:34, shape:"round-rectangle", "background-color":"#C70", color:"#fff", "text-valign":"center", "text-margin-y":0, "font-size":9, "font-weight":600, "text-max-width":50 }},
        { selector: "node[kind = 'capability']", style: { width:46, height:30, shape:"round-rectangle", "background-color":"#8888b0", color:"#fff", "text-valign":"center", "text-margin-y":0, "font-size":9, "text-max-width":44 }},
        { selector: "node[kind = 'graph']", style: { width:44, height:44, shape:"diamond", "background-color":"#0070F2" }},
        { selector: "node[kind = 'grouping']", style: { width:44, height:44, shape:"hexagon", "background-color":"#babade" }},
        { selector: "edge", style: { "curve-style":"bezier", width: SCOPE === "core" ? 2.2 : 1.6, "line-color":"#8b8bb0", "target-arrow-color":"#8b8bb0", "target-arrow-shape":"triangle", "arrow-scale":1, "font-size": SCOPE === "core" ? 16 : 12, color:"#3d3d6b", "text-background-color":"#fff", "text-background-opacity":1, "text-background-padding":5, "text-wrap":"wrap", "text-max-width": SCOPE === "core" ? 240 : 140, "text-valign":"center", label:"data(label)" }},
        { selector: "edge[kind = 'feed']", style: { "line-style":"dashed", "line-color":"#497", "target-arrow-color":"#497", width:1.1 }},
        { selector: "edge[kind = 'enable']", style: { "line-style":"dashed", "line-color":"#C70", "target-arrow-color":"#C70", width:1.1 }},
        { selector: "edge[kind = 'graphedge']", style: { "line-style":"dotted", "line-color":"#0070F2", "target-arrow-color":"#0070F2" }}
      ]
    });
    cy.nodes().filter((n) => hideByScope(n.data("kind"), n.data("typeId"), n.data("abstract"))).remove();
    const common = { animate:false, fit:true, padding: SCOPE === "core" ? 80 : 56 };
    const done = function() { document.title = "READY"; };
    if (LAYOUT === "cose") cy.layout({ name:"cose", ...common, nodeRepulsion: 28000, idealEdgeLength: 140, gravity:0.18, numIter:2200, stop: done }).run();
    else cy.layout({ name:"dagre", ...common, rankDir:"LR", nodeSep: SCOPE === "core" ? 180 : 96, rankSep: SCOPE === "core" ? 380 : 200, edgeSep: SCOPE === "core" ? 80 : 40, stop: done }).run();
    }
    window.addEventListener("load", function() { setTimeout(start, 800); });
  </script>
</body>
</html>
